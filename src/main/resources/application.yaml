spring:
  application:
    name: rent-flow-pricing
  cache:
    type: redis
    cache-names: pricingBySerial
    redis:
      time-to-live: ${PRICING_CACHE_TTL:1h}
      cache-null-values: false
      enable-statistics: true
      use-key-prefix: true
      key-prefix: "rentflow:pricing:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:200ms}
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  flyway:
    create-schemas: false
    default-schema: pricing
    schemas: pricing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pricing
  sql:
    init:
      mode: never
  http:
    serviceclient:
      inventory:
        base-url: ${INVENTORY_BASE_URL:http://inventory}
        connect-timeout: 500ms
        read-timeout: 1500ms

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.rentflow.service.rest.UnexpectedInventoryResponseException
  retry:
    instances:
      inventory:
        max-attempts: 2
        wait-duration: 500ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.2
        retry-exception-predicate: com.rentflow.service.rest.InventoryRetryableExceptionPredicate
