spring:
  main:
    banner-mode: "off"
  application:
    name: rent-flow-pricing
  cache:
    type: redis
    cache-names: pricingBySerial
    redis:
      time-to-live: ${PRICING_CACHE_TTL:1h}
      cache-null-values: false
      enable-statistics: true
      use-key-prefix: true
      key-prefix: "rentflow:pricing:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:200ms}
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  flyway:
    create-schemas: false
    default-schema: pricing
    schemas: pricing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pricing
  sql:
    init:
      mode: never
  http:
    serviceclient:
      inventory:
        base-url: ${INVENTORY_BASE_URL:http://inventory}
        connect-timeout: 500ms
        read-timeout: 1500ms

springdoc:
  paths-to-match: /api/v1/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8086}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${OBSERVABILITY_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        pricing.cache.lookup: true
        pricing.inventory.lookup: true
      minimum-expected-value:
        http.server.requests: 1ms
        http.client.requests: 1ms
        pricing.cache.lookup: 1ms
        pricing.inventory.lookup: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        http.client.requests: 10s
        pricing.cache.lookup: 10s
        pricing.inventory.lookup: 10s
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${OBSERVABILITY_ENVIRONMENT:local}
      service.instance.id: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    tracing:
      export:
        max-queue-size: 2048
        max-batch-size: 512
        otlp:
          transport: http
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 2s
          timeout: 2s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${OBSERVABILITY_ENVIRONMENT:local}
        node-name: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    json:
      stacktrace:
        max-length: 16384
        max-throwable-depth: 64

jdbc:
  includes: connection,query
  hikari:
    enabled: false
  resultset-operations:
    enabled: false
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
    slow-query:
      enable-logging: false

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.rentflow.service.rest.UnexpectedInventoryResponseException
  retry:
    instances:
      inventory:
        max-attempts: 2
        wait-duration: 500ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.2
        retry-exception-predicate: com.rentflow.service.rest.InventoryRetryableExceptionPredicate
