spring:
  application:
    name: rent-flow-pricing
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  flyway:
    create-schemas: false
    default-schema: pricing
    schemas: pricing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pricing
  sql:
    init:
      mode: never

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never
